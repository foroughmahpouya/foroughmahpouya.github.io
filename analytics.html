<script>
(function () {
  // ANALYTICS_V3_CLICK_TRACKING

  const endpoint =
    "https://website-visit-logger.foroughmahpouya.workers.dev/collect";

  function track(value) {
    if (!value) return;

    fetch(endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        page: value
      }),
      keepalive: true
    }).catch(function () {
      // Never let analytics interfere with the website.
    });
  }

  // Record website opening
  track("/");

  // Record navigation, downloads, and external links
  document.addEventListener("click", function (event) {
    const link = event.target.closest("a");

    if (!link) return;

    const href = link.getAttribute("href");

    if (!href) return;

    let url;

    try {
      url = new URL(href, window.location.href);
    } catch {
      return;
    }

    // Navigation to a section on this one-page website
    if (url.origin === window.location.origin && url.hash) {
      const section =
        decodeURIComponent(url.hash.substring(1));

      if (section) {
        track("/section/" + section);
      }

      return;
    }

    // PDF / CV download
    if (url.pathname.toLowerCase().endsWith(".pdf")) {
      track("/download" + url.pathname);
      return;
    }

    // Google Scholar
    if (
      url.hostname === "scholar.google.com" ||
      url.hostname.endsWith(".scholar.google.com")
    ) {
      track("/external/google-scholar");
      return;
    }

    // Any other external website
    if (url.origin !== window.location.origin) {
      track("/external/" + url.hostname);
    }
  });
})();
</script>
