<script>
(function () {
  // ANALYTICS_FINAL_BOOTSTRAP_TABS

  const endpoint =
    "https://website-visit-logger.foroughmahpouya.workers.dev/collect";

  const sent = new Set();

  function track(value) {
    if (!value || sent.has(value)) return;

    sent.add(value);

    fetch(endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        page: value
      }),
      keepalive: true
    }).catch(function () {
      // Analytics must never interfere with the website.
    });
  }

  function slug(text) {
    return text
      .trim()
      .toLowerCase()
      .replace(/&/g, "and")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }

  // Website opened
  track("/");

  // Quarto / Bootstrap tabs:
  // Research, Publications, Teaching, Talks & News
  document
    .querySelectorAll('.research-tabs a[data-bs-toggle="tab"]')
    .forEach(function (tab) {
      tab.addEventListener("shown.bs.tab", function (event) {
        const name = slug(event.target.textContent || "");

        if (name) {
          track("/section/" + name);
        }
      });
    });

  // Downloads and external links
  document.addEventListener("click", function (event) {
    const link = event.target.closest("a[href]");

    if (!link) return;

    // Tabs are handled above.
    if (link.getAttribute("data-bs-toggle") === "tab") {
      return;
    }

    const href = link.getAttribute("href");

    if (!href || href.startsWith("mailto:")) {
      return;
    }

    let url;

    try {
      url = new URL(href, window.location.href);
    } catch {
      return;
    }

    // CV / PDF download
    if (url.pathname.toLowerCase().endsWith(".pdf")) {
      track("/download" + url.pathname);
      return;
    }

    // Google Scholar
    if (url.hostname === "scholar.google.com") {
      track("/external/google-scholar");
      return;
    }

    // LinkedIn
    if (
      url.hostname === "linkedin.com" ||
      url.hostname.endsWith(".linkedin.com")
    ) {
      track("/external/linkedin");
      return;
    }

    // ORCID
    if (url.hostname === "orcid.org") {
      track("/external/orcid");
      return;
    }

    // Other external links
    if (url.origin !== window.location.origin) {
      track("/external/" + url.hostname);
    }
  });
})();
</script>
