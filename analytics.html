<script>
(function () {
  const endpoint =
    "https://website-visit-logger.foroughmahpouya.workers.dev/collect";

  // Avoid recording the same action repeatedly during one page load.
  const sent = new Set();

  function track(value) {
    if (!value || sent.has(value)) return;

    sent.add(value);

    fetch(endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        page: value
      }),
      keepalive: true
    }).catch(function () {
      // Analytics must never interfere with the website.
    });
  }

  // 1. Record initial website visit
  track(window.location.pathname);

  // 2. Record sections that the visitor actually reaches
  const sections = document.querySelectorAll("main section[id]");

  const observer = new IntersectionObserver(
    function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting && entry.target.id) {
          track("/section/" + entry.target.id);
        }
      });
    },
    {
      // Detect when a section passes through the central part of the screen
      rootMargin: "-35% 0px -55% 0px",
      threshold: 0
    }
  );

  sections.forEach(function (section) {
    observer.observe(section);
  });

  // 3. Record important link clicks
  document.addEventListener("click", function (event) {
    const link = event.target.closest("a");

    if (!link || !link.href) return;

    let url;

    try {
      url = new URL(link.href, window.location.href);
    } catch {
      return;
    }

    // Internal section-navigation click
    if (
      url.origin === window.location.origin &&
      url.pathname === window.location.pathname &&
      url.hash
    ) {
      const sectionName = decodeURIComponent(
        url.hash.substring(1)
      );

      track("/section/" + sectionName);
      return;
    }

    // PDF download, including CV
    if (url.pathname.toLowerCase().endsWith(".pdf")) {
      track("/download" + url.pathname);
      return;
    }

    // Google Scholar
    if (url.hostname === "scholar.google.com") {
      track("/external/google-scholar");
      return;
    }

    // Other external websites
    if (url.origin !== window.location.origin) {
      track("/external/" + url.hostname);
    }
  });
})();
</script>
