<script>
(function () {
  // ANALYTICS_V4_QUARTO_TAB_TRACKING

  const endpoint =
    "https://website-visit-logger.foroughmahpouya.workers.dev/collect";

  function track(value) {
    if (!value) return;

    fetch(endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        page: value
      }),
      keepalive: true
    }).catch(function () {
      // Analytics must never interfere with the website.
    });
  }

  function slug(text) {
    return text
      .trim()
      .toLowerCase()
      .replace(/&/g, "and")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }

  // Opening the website
  track("/");

  document.addEventListener("click", function (event) {
    const link = event.target.closest("a");

    if (!link) return;

    // Quarto / Bootstrap tabs:
    // Research, Publications, Teaching, Talks & News
    if (link.getAttribute("data-bs-toggle") === "tab") {
      const section = slug(link.textContent || "");

      if (section) {
        track("/section/" + section);
      }

      return;
    }

    const href = link.getAttribute("href");

    if (!href) return;

    let url;

    try {
      url = new URL(href, window.location.href);
    } catch {
      return;
    }

    // CV and other PDF downloads
    if (url.pathname.toLowerCase().endsWith(".pdf")) {
      track("/download" + url.pathname);
      return;
    }

    // Google Scholar
    if (
      url.hostname === "scholar.google.com" ||
      url.hostname.endsWith(".scholar.google.com")
    ) {
      track("/external/google-scholar");
      return;
    }

    // ORCID
    if (url.hostname === "orcid.org") {
      track("/external/orcid");
      return;
    }

    // LinkedIn
    if (
      url.hostname === "linkedin.com" ||
      url.hostname.endsWith(".linkedin.com")
    ) {
      track("/external/linkedin");
      return;
    }

    // Other external websites
    if (url.origin !== window.location.origin) {
      track("/external/" + url.hostname);
    }
  });
})();
</script>
